---
# topolvm.yml
# This playbook handles inspection and installation of TopoLVM on a microk8s cluster
# - Inspect nodes for LVM suitability


- name: Check LVM configuration on nodes
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    topolvm_version: "v15.5.5"
  tasks:
    - name: Ensure required packages are installed
      package:
        name: 
          - lvm2
          - thin-provisioning-tools
        state: present
      register: package_install

    - name: Get list of physical volumes
      command: pvs --noheadings -o pv_name
      register: pvs_output
      changed_when: false

    - name: Get list of volume groups
      command: vgs --noheadings -o vg_name
      register: vgs_output
      changed_when: false

    - name: Get list of logical volumes
      command: lvs --noheadings -o vg_name,lv_name
      register: lvs_output
      changed_when: false

    - name: Check for available free space (unallocated physical volumes)
      command: pvs --noheadings -o pv_name,vg_name,pv_free
      register: free_space
      changed_when: false

    - name: Check if lvm2-lvmpolld service is running (modern LVM)
      service:
        name: lvm2-lvmpolld
        state: started
        enabled: yes
      register: lvm_service
      ignore_errors: yes

    - name: Show LVM status summary
      debug:
        msg: |
          Node: {{ ansible_hostname }}
          Physical Volumes: {{ pvs_output.stdout_lines | length }}
          Volume Groups: {{ vgs_output.stdout_lines | length }}
          Logical Volumes: {{ lvs_output.stdout_lines | length }}
          LVM Service Status: {% if lvm_service is not failed and lvm_service.state is defined %}{{ 'Running' if lvm_service.state == 'started' else 'Not running' }}{% else %}Service check failed{% endif %}

    - name: Gather all block devices info
      command: lsblk -J
      register: block_devices
      changed_when: false

    - name: Get raw block devices info
      command: lsblk -J -o NAME,TYPE,MOUNTPOINTS
      register: block_devices_raw
      changed_when: false
      ignore_errors: yes

    - name: Parse block devices info
      set_fact:
        available_devices: >-
          {% if block_devices_raw.stdout and block_devices_raw.stdout | from_json %}
            {% set devices = block_devices_raw.stdout | from_json %}
            {% for device in devices.blockdevices %}
              {% if device.type == 'disk' and not device.mountpoints %}
                {{ device.name }}
              {% endif %}
            {% endfor %}
          {% else %}
            []
          {% endif %}

    - name: Show available devices
      debug:
        var: available_devices
      when: available_devices is defined

    - name: Validate available devices
      assert:
        that:
          - available_devices is defined
          - available_devices | length > 0
        fail_msg: "No suitable block devices found for LVM"
        success_msg: "Found {{ available_devices | length }} available device(s)"
      ignore_errors: yes

    - name: Show available devices
      debug:
        msg: |
          Available devices for potential LVM use:
          {{ available_devices | list }}
      when: available_devices is defined
          
    # Store all collected info as facts for later use
    - name: Set node LVM facts
      set_fact:
        lvm_configured: "{{ vgs_output.stdout_lines | length > 0 }}"
        has_available_devices: "{{ available_devices | length > 0 }}"
        node_ready_for_topolvm: false  # Default value

    - name: Check for TopoLVM volume group
      set_fact:
        topolvm_vg_exists: "{{ 'topolvm-vg' in vgs_output.stdout }}"

    - name: Determine if node is ready for TopoLVM
      set_fact:
        node_ready_for_topolvm: "{{ lvm_configured or has_available_devices }}"

    # Register host status in a way that can be used by the next play
    - name: Register host LVM status for inventory
      add_host:
        name: "{{ inventory_hostname }}"
        group: topolvm_ready_nodes
        lvm_status: "{{ node_ready_for_topolvm | bool }}"
        topolvm_vg_exists: "{{ topolvm_vg_exists | default(false) | bool }}"
        available_devices: "{{ available_devices | list }}"
        topolvm_vg_name: "{{ topolvm_vg_name | default('topolvm-vg') }}"
        kube_config: "{{ kube_config | default('/var/snap/microk8s/current/credentials/client.config') }}"
        topolvm_version: "{{ topolvm_version  }}"
      when: node_ready_for_topolvm | bool

    - name: We need to add the master node to the inventory because delegate_to does not work with non standard port
      ansible.builtin.add_host:
        hostname: k8s_api
        ansible_ssh_host: "{{hostvars[groups['k8s_master'][0]].ansible_ssh_host}}"
        ansible_ssh_port: "{{hostvars[groups['k8s_master'][0]].ansible_port}}"
        ansible_user: "{{hostvars[groups['k8s_master'][0]].ansible_user}}"



- name: Install and configure TopoLVM on the cluster
  hosts: k8s_master[0]
  become: yes
  vars:
    topolvm_version: "v15.5.5"
    kube_config: "/var/snap/microk8s/current/credentials/client.config"
  tasks:
    - name: Show nodes that are suitable for TopoLVM
      debug:
        msg: "Nodes suitable for TopoLVM: {{ groups['topolvm_ready_nodes'] | default([]) }}"

    - name: Check if any nodes are ready for TopoLVM
      fail:
        msg: "No nodes are ready for TopoLVM. Ensure nodes have LVM configured or have available disk space."
      when: groups['topolvm_ready_nodes'] is not defined or groups['topolvm_ready_nodes'] | length == 0

    - name: Ensure kubectl is available
      command: microk8s kubectl version --client
      register: kubectl_version
      changed_when: false
      failed_when: kubectl_version.rc != 0

    - name: Ensure storage addon is enabled in microk8s
      command: microk8s enable storage
      register: storage_result
      changed_when: "'Enabling default storage class' in storage_result.stdout"
      failed_when: storage_result.rc != 0

    - name: Ensure helm is available
      command: microk8s helm3 version --client
      register: helm_version
      changed_when: false
      failed_when: helm_version.rc != 0

    - name: Create temporary directory for TopoLVM manifests
      file:
        path: /tmp/topolvm-setup
        state: directory
        mode: '0755'

    - name: Upload topo-debug.sh script
      copy:
        src: "{{ playbook_dir }}/../examples/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        remote_src: false
      loop:
        - topolvm-k8s-debug.sh
        - topo-debug.sh
      tags:
        - debug


# Configure nodes - create volume group if needed
- name: Create TopoLVM volume group on nodes that don't have it
  hosts: topolvm_ready_nodes    
  environment:
    K8S_AUTH_KUBECONFIG: /var/snap/microk8s/current/credentials/client.config
    KUBECONFIG: /var/snap/microk8s/current/credentials/kubelet.config
    CERT_MANAGER_VERSION: "v1.17.1"
  vars:
    topolvm_version: "v15.5.5"
    kube_config: "/var/snap/microk8s/current/credentials/client.config"
    enable_cert_manager: true
    lvmdEmbedded: false
  
    values_yaml_path: "/tmp/topolvm-setup/values.yaml"
    
  become: yes
  tasks:
    - name: Create physical volume on first available device
      command: "pvcreate /dev/{{ available_devices[0] }}"
      when:
        - not topolvm_vg_exists
        - available_devices | length > 0
      register: pvcreate_result
      changed_when: pvcreate_result.rc == 0
      failed_when: pvcreate_result.rc not in [0, 5]  # 5 means device already initialized

    - name: Create TopoLVM volume group
      command: "vgcreate {{ topolvm_vg_name }} /dev/{{ available_devices[0] }}"
      when:
        - not topolvm_vg_exists
        - available_devices | length > 0
      register: vgcreate_result
      changed_when: vgcreate_result.rc == 0
      failed_when: vgcreate_result.rc not in [0, 5]  # 5 means volume group already exists

    # Continue with master node setup
    - name: Download TopoLVM Helm chart
      command: >
        microk8s helm3 repo add topolvm https://topolvm.github.io/topolvm
      changed_when: false

    - name: Update Helm repositories
      command: microk8s helm3 repo update
      changed_when: false

    # Create CRDs and namespace first
    - name: Create namespace for TopoLVM
      k8s:
        kubeconfig: "{{ kube_config }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: topolvm-system

    - name: Add the TopoLVM helm repository
      shell: >
        microk8s helm repo add topolvm https://topolvm.github.io/topolvm && microk8s helm repo update
      changed_when: true

    - name: Ensure required namespaces exist and label them for TopoLVM webhook
      delegate_to: k8s_api
      become: true
      kubernetes.core.k8s:
        state: present # absent
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
            labels:
              topolvm.io/webhook: "ignore"
      loop:
        - topolvm-system
        - kube-system

    - name: Ensure cert-manager CRDs are managed appropriately
      delegate_to: k8s_api
      command: >
        microk8s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.crds.yaml
      changed_when: true



    # Create values.yaml for Helm
    - name: Create values.yaml for TopoLVM helm chart
      copy:
        dest: "{{ values_yaml_path }}"
        content: |
          node:
            # node.lvmdEmbedded -- Specify whether to embed lvmd in the node container.
            # Should not be used in conjunction with lvmd.managed otherwise lvmd will be started twice.
            lvmdEmbedded: {{ lvmdEmbedded }}
            # lvmd:
              # managed: false
            # node.lvmdSocket -- Specify the socket to be used for communication with lvmd.
            lvmdSocket: /run/topolvm/lvmd.sock
            # node.kubeletWorkDirectory -- Specify the work directory of Kubelet on the host.
            # For example, on microk8s it needs to be set to `/var/snap/microk8s/common/var/lib/kubelet`
            kubeletWorkDirectory: /var/snap/microk8s/common/var/lib/kubelet

    # Create ConfigMap with lvmd configuration
    # - name: Create lvmd ConfigMap
    #   delegate_to: k8s_api
    #   command: >
    #     microk8s kubectl create configmap -n topolvm-system lvmd-config --from-literal=lvmd.yaml='
    #     deviceClasses:
    #       - name: ssd
    #         volume-group: {{ topolvm_vg_name }}
    #         default: true
    #         spare-gb: 10
    #     '

    # Install TopoLVM using Helm
    - name: Install TopoLVM with Helm
      delegate_to: k8s_api
      command: >
        microk8s helm3 upgrade --install  topolvm topolvm/topolvm 
        --namespace topolvm-system 
        --version {{ topolvm_version }}
        --values {{ values_yaml_path }}
      changed_when: true

    # Wait for TopoLVM to be ready
    - name: Wait for TopoLVM pods to be ready
      command: >
        microk8s kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=topolvm -n topolvm-system --timeout=300s
      register: pod_wait
      changed_when: false
      retries: 2
      delay: 20
      until: pod_wait.rc == 0



    # Test deployment (optional)
    - name: Create a test PVC
      k8s:
        kubeconfig: "{{ kube_config }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: topolvm-test-pvc
            namespace: default
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: topolvm-ssd
