---
# Configure nodes - create volume group if needed
- name: Create TopoLVM volume group on nodes that don't have it
  hosts: k8s_master[0]
  # connection: local
  vars:
    topolvm_version: "v15.5.5"
    cert_manager_version: "v1.17.1"
    topolvm_vg_name: "topolvm"
    values_path: /tmp/topolvm-setup/values.yaml
    # ansible_python_interpreter: "{{ playbook_dir }}/.venv/bin/python"
  gather_facts: false
  tasks:
    # - name: Create physical volume on first available device
    #   command: "pvcreate /dev/{{ available_devices[0] }}"
    #   when: 
    #     - not topolvm_vg_exists 
    #     - available_devices | length > 0

    # - name: Create TopoLVM volume group
    #   command: "vgcreate {{ topolvm_vg_name }} /dev/{{ available_devices[0] }}"
    #   when: 
    #     - not topolvm_vg_exists 
    #     - available_devices | length > 0

    # Continue with master node setup
    - name: Download TopoLVM Helm chart
      command: >
        helm repo add topolvm https://topolvm.github.io/topolvm
      changed_when: false

    - name: Update Helm repositories
      command: helm repo update
      changed_when: false

    # - name: Apply cert-manager CRDs
    #   command: >
    #       microk8s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.crds.yaml 
    #   changed_when: true

    # Create CRDs and namespace first
    - name: Ensure required namespaces exist and label them for TopoLVM webhook
      environment:
        KUBECONFIG: /var/snap/microk8s/current/credentials/kubelet.config
      kubernetes.core.k8s:
        state: present # absent
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
            labels:
              topolvm.io/webhook: "ignore"
      loop:
        - topolvm-system
        - kube-system

    # - name: Download TopoLVM chart to extract CRDs
    #   command: >
    #     helm pull topolvm/topolvm --version {{ topolvm_version }} --untar --untardir /tmp/topolvm-setup
    #   changed_when: true
      
  
    
    - name: Create directory for values.yaml
      file:
        path: "{{ values_path | dirname }}"
        state: directory
        mode: '0755'
      changed_when: false

    - name: Ensure {{ values_path }} is writable
      become: true
      file:
        path: "{{ values_path }}"
        state: touch
        mode: '0644'




    # Create values.yaml for Helm
    # https://github.com/topolvm/topolvm/blob/main/charts/topolvm/values.yaml
    - name: Create values.yaml for TopoLVM helm chart
      become: true
      copy:
        dest: /tmp/topolvm-setup/values.yaml
        content: |
          useLegacy: false
          scheduler:
            enable: true
          node:
            kubeletWorkDirectory: /var/snap/microk8s/common/var/lib/kubelet
          lvmd:
            managed: true
            deviceClasses:
              - name: ssd
                volume-group: {{ topolvm_vg_name }}
                default: true
                spare-gb: 10

    # Install TopoLVM using Helm
    - name: Install TopoLVM with Helm
      command: >
        microk8s helm install topolvm topolvm/topolvm \
        --namespace topolvm-system \
        --version {{ topolvm_version }} \
        --values /tmp/topolvm-setup/values.yaml
      changed_when: true

    # Wait for TopoLVM to be ready
    - name: Wait for TopoLVM pods to be ready
      environment:
        KUBECONFIG: /var/snap/microk8s/current/credentials/kubelet.config
      command: >
        kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=topolvm -n topolvm-system --timeout=300s
      register: pod_wait
      changed_when: false
      retries: 5
      delay: 20
      until: pod_wait.rc == 0

